# Runs formatting, vet, and the cgo-free test suite. The cgo-backed packages
# (store/ladybug, internal/dbtest, cmd/quiver) need the native LadyBug
# library and are exercised locally via `go test -tags system_ladybug ./...`
# (see README, Development).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pure:
    name: fmt, vet, pure tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make fmt-check
      - run: go vet ./model/... ./schema/... ./goparse/... ./dump/... ./store ./query/... ./internal/testutil
      - run: make test-pure
